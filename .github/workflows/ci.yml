name: CI

on:
  push:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy ccache ninja-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-lint-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-lint-${{ github.ref }}-
            ${{ runner.os }}-ccache-lint-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          ccache --zero-stats
          ccache --show-config

      - name: Configure (clang-tidy enabled)
        run: cmake -S . -B build -DBUILD_TESTS=ON -DENABLE_CLANG_TIDY=ON -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (clang-tidy)
        run: cmake --build build

      - name: clang-format check
        run: |
          git ls-files '*.cpp' '*.h' | xargs -r clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-build-${{ github.ref }}-
            ${{ runner.os }}-ccache-build-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          ccache --zero-stats
          ccache --show-config

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
