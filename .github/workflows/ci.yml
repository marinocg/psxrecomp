name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: Configure (clang-tidy enabled)
        run: cmake -S . -B build -DBUILD_TESTS=ON -DENABLE_CLANG_TIDY=ON

      - name: Build (clang-tidy)
        run: cmake --build build

      - name: Test (clang-tidy build)
        run: ctest --test-dir build --output-on-failure

      - name: clang-format check
        run: |
          git ls-files '*.cpp' '*.h' | xargs -r clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
