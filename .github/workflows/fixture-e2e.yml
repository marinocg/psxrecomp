name: Fixture E2E CI

on:
  workflow_dispatch:
    inputs:
      demo_artifact_run_id:
        description: "Optional workflow run ID from 'Build demo ISOs' to validate generated ISOs"
        required: false
        type: string
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tools/iso_fixture_generator*"
      - "tools/validate_iso_fixtures.sh"
      - "CMakeLists.txt"
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "include/**"
      - "tools/iso_fixture_generator*"
      - "tools/validate_iso_fixtures.sh"
      - "CMakeLists.txt"

concurrency:
  group: fixture-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-e2e:
    name: Fixture E2E validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=ON -DBUILD_CLI=ON

      - name: Build
        run: cmake --build build -j4

      - name: Run fixture validation
        env:
          VALIDATION_DIR: ${{ runner.temp }}/psxrecomp_iso_validation
        run: |
          rm -rf "$VALIDATION_DIR"
          tools/validate_iso_fixtures.sh ./build/psxrecomp "$VALIDATION_DIR"

      - name: Download demo ISO artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.demo_artifact_run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ inputs.demo_artifact_run_id }}
          name: psxrecomp-demos-ubuntu-latest
          path: ${{ runner.temp }}/demo_isos
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated demo ISOs
        if: github.event_name == 'workflow_dispatch' && inputs.demo_artifact_run_id != ''
        env:
          DEMO_ISO_DIR: ${{ runner.temp }}/demo_isos
          DEMO_OUT_DIR: ${{ runner.temp }}/demo_iso_validation_out
        run: |
          mkdir -p "$DEMO_OUT_DIR"
          for iso in "$DEMO_ISO_DIR"/*.iso; do
            echo "Validating ${iso}"
            ./build/psxrecomp --json -o "$DEMO_OUT_DIR" "$iso" > "$DEMO_OUT_DIR/$(basename "$iso").json"
          done

      - name: Upload fixture validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/psxrecomp_iso_validation/bad.json
            ${{ runner.temp }}/psxrecomp_iso_validation/good.json
            ${{ runner.temp }}/psxrecomp_iso_validation/good_rich.json
            ${{ runner.temp }}/psxrecomp_iso_validation/fixtures/fixtures_manifest.json
            ${{ runner.temp }}/psxrecomp_iso_validation/out/**/CMakeLists.txt
            ${{ runner.temp }}/demo_iso_validation_out/*.json
          if-no-files-found: warn
