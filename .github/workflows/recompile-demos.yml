name: Recompile demo artifacts

on:
  workflow_run:
    workflows: ["Build binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional Build binaries workflow run ID to pull demo artifacts from"
        required: false
        type: string
      ref:
        description: "Git ref to checkout when run manually (used if run_id is not provided)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve source run
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      ref: ${{ steps.resolve.outputs.ref }}
      should_run: ${{ steps.resolve.outputs.should_run }}
    steps:
      - name: Resolve workflow source
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "${GITHUB_OUTPUT}"
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
            if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
              echo "should_run=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_run=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            run_id="${{ github.event.inputs.run_id }}"
            if [[ -z "${run_id}" ]]; then
              echo "run_id=" >> "${GITHUB_OUTPUT}"
            else
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
            fi
            echo "ref=${{ github.event.inputs.ref }}" >> "${GITHUB_OUTPUT}"
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          fi

  recompile:
    name: Recompile demos (${{ matrix.os }})
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja && vcpkg install sdl2:x64-windows

      - name: Build recompiler executable
        run: make build

      - name: Download demo artifact from build workflow run
        if: needs.resolve.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve.outputs.run_id }}
          name: psxrecomp-demos-ubuntu-latest
          path: input-demos
          if_no_artifact_found: fail

      - name: Download latest demo artifact from Build binaries workflow
        if: needs.resolve.outputs.run_id == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          branch: ${{ github.ref_name }}
          name: psxrecomp-demos-ubuntu-latest
          path: input-demos
          if_no_artifact_found: fail

      - name: Recompile demo ISOs
        id: run_recomp
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p recompile-artifacts/source recompile-artifacts/logs recompile-artifacts/inputs
          mkdir -p recompile-artifacts/runnable

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            BIN="$(pwd)/build/psxrecomp.exe"
          else
            BIN="$(pwd)/build/psxrecomp"
          fi

          cp "${BIN}" recompile-artifacts/

          if command -v cmake >/dev/null 2>&1; then
            CMAKE_BIN="$(command -v cmake)"
          elif [[ -x "/Applications/CMake.app/Contents/bin/cmake" ]]; then
            CMAKE_BIN="/Applications/CMake.app/Contents/bin/cmake"
          else
            echo "Unable to locate cmake in PATH." >&2
            exit 1
          fi

          isos=()
          while IFS= read -r iso; do
            isos+=("${iso}")
          done < <(find input-demos -type f -name '*.iso' | sort)
          if [[ ${#isos[@]} -eq 0 ]]; then
            echo "No ISO files found in downloaded demo artifact" >&2
            exit 1
          fi

          failed=0
          for iso in "${isos[@]}"; do
            base="$(basename "${iso}" .iso)"
            out_dir="recompile-artifacts/source/${base}"
            mkdir -p "${out_dir}"
            cp "${iso}" recompile-artifacts/inputs/

            stdout_log="recompile-artifacts/logs/${base}.stdout.log"
            stderr_log="recompile-artifacts/logs/${base}.stderr.log"
            json_log="recompile-artifacts/logs/${base}.result.json"

            echo "Running recompiler for ${iso}"
            if "${BIN}" --json -o "${out_dir}" "${iso}" >"${stdout_log}" 2>"${stderr_log}"; then
              cp "${stdout_log}" "${json_log}"

              generated_cmake_files=()
              while IFS= read -r cmake_file; do
                generated_cmake_files+=("${cmake_file}")
              done < <(find "${out_dir}" -type f -name 'CMakeLists.txt' | sort)
              if [[ ${#generated_cmake_files[@]} -eq 0 ]]; then
                echo "Generated output for ${base} is missing CMakeLists.txt" >&2
                failed=1
                continue
              fi

              source_root="$(dirname "${generated_cmake_files[0]}")"
              if [[ ${#generated_cmake_files[@]} -gt 1 ]]; then
                echo "Multiple CMakeLists.txt files found for ${base}; using ${source_root}" >&2
              fi

              generated_build_dir="${out_dir}/build-generated"

              cmake_extra_args=()
              if [[ "${RUNNER_OS}" == "Windows" && -n "${VCPKG_INSTALLATION_ROOT:-}" ]]; then
                cmake_extra_args+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake")
              fi

              if "${CMAKE_BIN}" -S "${source_root}" -B "${generated_build_dir}" -G Ninja \
                 ${cmake_extra_args[@]+"${cmake_extra_args[@]}"} \
                 -DPSXRECOMP_ENABLE_LOGGING=ON \
                 -DPSXRECOMP_LOG_LEVEL=2 >"recompile-artifacts/logs/${base}.cmake.configure.log" 2>&1 && \
                 "${CMAKE_BIN}" --build "${generated_build_dir}" >"recompile-artifacts/logs/${base}.cmake.build.log" 2>&1; then
                demo_runnable_dir="recompile-artifacts/runnable/${base}"
                mkdir -p "${demo_runnable_dir}/bin"

                while IFS= read -r -d '' exe; do
                  cp "${exe}" "${demo_runnable_dir}/bin/"

                  exe_dir="$(dirname "${exe}")"
                  if [[ "${RUNNER_OS}" == "Windows" ]]; then
                    while IFS= read -r -d '' dll; do
                      cp "${dll}" "${demo_runnable_dir}/bin/"
                    done < <(find "${exe_dir}" -maxdepth 1 -type f -name '*.dll' -print0)
                  fi

                  if [[ -d "${exe_dir}/resources" ]]; then
                    cp -R "${exe_dir}/resources" "${demo_runnable_dir}/bin/"
                  fi
                done < <(find "${generated_build_dir}" -type f \( -name '*.exe' -o -perm -u+x \) -print0)

                for resource_dir_name in resources assets data; do
                  if [[ -d "${source_root}/${resource_dir_name}" ]]; then
                    cp -R "${source_root}/${resource_dir_name}" "${demo_runnable_dir}/bin/"
                  elif [[ -d "${out_dir}/${resource_dir_name}" ]]; then
                    cp -R "${out_dir}/${resource_dir_name}" "${demo_runnable_dir}/bin/"
                  fi
                done
              else
                failed=1
              fi
            else
              failed=1
            fi
          done

          if command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python3)"
          elif command -v python >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python)"
          else
            echo "Python is required to generate unsupported opcode reports." >&2
            failed=1
          fi

          if [[ -n "${PYTHON_BIN:-}" ]]; then
            "${PYTHON_BIN}" tools/report_unsupported_opcodes.py \
              --log-dir recompile-artifacts/logs \
              --output-json recompile-artifacts/logs/unsupported-opcode-report.json \
              --output-md recompile-artifacts/logs/unsupported-opcode-report.md \
              --output-trend-json recompile-artifacts/logs/unsupported-opcode-trend.json \
              --output-trend-md recompile-artifacts/logs/unsupported-opcode-trend.md || failed=1
          fi

          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - name: Upload recompile artifact bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recompiled-demos-${{ matrix.os }}
          path: recompile-artifacts

      - name: Fail if any recompilation failed
        if: steps.run_recomp.outputs.failed == '1'
        shell: bash
        run: |
          echo "One or more demo recompilations failed; inspect uploaded logs/artifacts." >&2
          exit 1
