name: Build binaries

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target OS to build (all, ubuntu-latest, windows-latest, macos-latest)"
        required: false
        default: "all"

jobs:
  validate:
    name: Validate target OS input
    runs-on: ubuntu-latest
    steps:
      - name: Check target_os
        shell: bash
        run: |
          allowed=("all" "ubuntu-latest" "windows-latest" "macos-latest")
          target="${{ github.event.inputs.target_os }}"
          for value in "${allowed[@]}"; do
            if [[ "${value}" == "${target}" ]]; then
              exit 0
            fi
          done
          echo "Invalid target_os: ${target}" >&2
          echo "Allowed values: ${allowed[*]}" >&2
          exit 1

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.target_os == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || format('["{0}"]', github.event.inputs.target_os)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Build
        run: make build

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "build/package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "build/psxrecomp.exe" "$packageDir/" -Force

          # Copy produced DLLs (if any) from build directory.
          Get-ChildItem -Path "build" -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$packageDir/" -Force
          }

          # Also copy MinGW runtime DLLs when present (libstdc++, libgcc, winpthread).
          $gxxPath = (Get-Command g++ -ErrorAction SilentlyContinue).Source
          if ($gxxPath) {
            $compilerBin = Split-Path -Parent $gxxPath
            @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll") | ForEach-Object {
              $dllPath = Join-Path $compilerBin $_
              if (Test-Path $dllPath) {
                Copy-Item $dllPath "$packageDir/" -Force
              }
            }
          }

      - name: Determine artifact path
        id: artifact
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "path=build/package" >> "${GITHUB_OUTPUT}"
          else
            echo "path=build/psxrecomp" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-${{ matrix.os }}
          path: ${{ steps.artifact.outputs.path }}

  demos:
    name: Build demo ISOs (ubuntu-latest)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSn00bSDK toolchain (prebuilt)
        run: ./examples/demos/toolchains/linux/install-psn00bsdk.sh

      - name: Configure demo environment
        run: |
          echo "PSN00BSDK=${GITHUB_WORKSPACE}/examples/demos/toolchains/linux/psn00bsdk/local" >> "${GITHUB_ENV}"
          echo "${GITHUB_WORKSPACE}/examples/demos/toolchains/linux/psn00bsdk/local/bin" >> "${GITHUB_PATH}"

      - name: Build demos
        run: |
          make -C examples/demos/helloworld
          make -C examples/demos/gputest
          make -C examples/demos/memorytest

      - name: Validate PS-X EXE signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          exe_paths = [
            Path('examples/demos/helloworld/HELLOWLD.EXE'),
            Path('examples/demos/gputest/GPUTEST.EXE'),
            Path('examples/demos/memorytest/MEMTEST.EXE'),
          ]

          for exe in exe_paths:
            if not exe.is_file():
              raise SystemExit(f"missing demo executable: {exe}")
            magic = exe.read_bytes()[:8]
            if magic != b"PS-X EXE":
              raise SystemExit(f"invalid PS-X EXE header in {exe}: {magic!r}")
          PY

      - name: Upload demo images
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-demos-ubuntu-latest
          path: |
            examples/demos/helloworld/HELLOWLD.iso
            examples/demos/helloworld/HELLOWLD.cue
            examples/demos/helloworld/HELLOWLD.EXE
            examples/demos/gputest/GPUTEST.iso
            examples/demos/gputest/GPUTEST.cue
            examples/demos/gputest/GPUTEST.EXE
            examples/demos/memorytest/MEMTEST.iso
            examples/demos/memorytest/MEMTEST.cue
            examples/demos/memorytest/MEMTEST.EXE
