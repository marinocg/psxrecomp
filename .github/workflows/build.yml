name: Build binaries

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DBUILD_CLI=ON

      - name: Build
        run: cmake --build build

      - name: Determine artifact path
        id: artifact
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "path=build/psxrecomp.exe" >> "${GITHUB_OUTPUT}"
          else
            echo "path=build/psxrecomp" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-${{ matrix.os }}
          path: ${{ steps.artifact.outputs.path }}
