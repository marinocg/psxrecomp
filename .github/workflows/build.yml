name: Build binaries

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: "Target OS to build (all, ubuntu-latest, windows-latest, macos-latest)"
        required: false
        default: "all"

jobs:
  validate:
    name: Validate target OS input
    runs-on: ubuntu-latest
    steps:
      - name: Check target_os
        shell: bash
        run: |
          allowed=("all" "ubuntu-latest" "windows-latest" "macos-latest")
          target="${{ github.event.inputs.target_os }}"
          for value in "${allowed[@]}"; do
            if [[ "${value}" == "${target}" ]]; then
              exit 0
            fi
          done
          echo "Invalid target_os: ${target}" >&2
          echo "Allowed values: ${allowed[*]}" >&2
          exit 1

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.target_os == 'all' && '["ubuntu-latest","windows-latest","macos-latest"]' || format('["{0}"]', github.event.inputs.target_os)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Build
        run: make build

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "build/package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "build/psxrecomp.exe" "$packageDir/" -Force
          Get-ChildItem -Path "build" -Filter "*.dll" -File | ForEach-Object {
            Copy-Item $_.FullName "$packageDir/" -Force
          }

      - name: Determine artifact path
        id: artifact
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "path=build/package" >> "${GITHUB_OUTPUT}"
          else
            echo "path=build/psxrecomp" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-${{ matrix.os }}
          path: ${{ steps.artifact.outputs.path }}
